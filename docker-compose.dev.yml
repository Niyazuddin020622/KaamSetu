services:
  mongo:
    image: mongo:7.0
    container_name: kaamsetu-mongo-dev
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data_dev:/data/db

  backend:
    image: node:20-alpine
    container_name: kaamsetu-backend-dev
    working_dir: /app
    volumes:
      - ./backend:/app
      - /app/node_modules
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=development
      - PORT=5000
      - MONGO_URI=mongodb://mongo:27017/worker_finder_db
      - JWT_SECRET=kaamsetu_dev_secret_key
      - ADMIN_PIN=admin123
    command: sh -c "npm install && npm run dev"
    depends_on:
      - mongo

  frontend:
    image: node:20-alpine
    container_name: kaamsetu-frontend-dev
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host"
    depends_on:
      - backend

  admin-dashboard:
    image: node:20-alpine
    container_name: kaamsetu-admin-dev
    working_dir: /app
    volumes:
      - ./admin-dashboard:/app
      - /app/node_modules
    ports:
      - "5174:5174"
    command: sh -c "npm install && npm run dev -- --host"
    depends_on:
      - backend

volumes:
  mongo_data_dev:
