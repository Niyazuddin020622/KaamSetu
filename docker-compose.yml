services:
  # ==========================================
  # 1. MongoDB Database Container
  # ==========================================
  mongo:
    image: mongo:7.0
    container_name: kaamsetu-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - kaamsetu-net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # 2. Node.js Express API Backend
  # ==========================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kaamsetu-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGO_URI=mongodb://mongo:27017/worker_finder_db
      - JWT_SECRET=kaamsetu_super_secure_jwt_token_key_2026
      - ADMIN_PIN=admin123
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - kaamsetu-net

  # ==========================================
  # 3. Frontend Portal (Customer & Worker)
  # ==========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: kaamsetu-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - kaamsetu-net

  # ==========================================
  # 4. Admin Dashboard Portal
  # ==========================================
  admin-dashboard:
    build:
      context: ./admin-dashboard
      dockerfile: Dockerfile
    container_name: kaamsetu-admin
    restart: unless-stopped
    ports:
      - "5174:80"
    depends_on:
      - backend
    networks:
      - kaamsetu-net

# ==========================================
# Persistent Volumes & Network
# ==========================================
volumes:
  mongo_data:
    driver: local

networks:
  kaamsetu-net:
    driver: bridge
