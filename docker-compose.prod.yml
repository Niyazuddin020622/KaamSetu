services:
  # ==========================================
  # 1. MongoDB Database Container
  # ==========================================
  mongo:
    image: mongo:7.0-jammy
    container_name: kaamsetu-mongo-prod
    restart: always
    volumes:
      - mongo_data_prod:/data/db
    networks:
      - kaamsetu-prod-net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ==========================================
  # 2. Node.js Express API Backend
  # ==========================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kaamsetu-backend-prod
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGO_URI=mongodb://mongo:27017/worker_finder_db
      - JWT_SECRET=${JWT_SECRET:-kaamsetu_super_secure_jwt_token_key_2026_prod}
      - ADMIN_PIN=${ADMIN_PIN:-admin123}
      - COOKIE_SECRET=${COOKIE_SECRET:-kaamsetu_cookie_secret_key_prod}
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - kaamsetu-prod-net

  # ==========================================
  # 3. Customer & Worker Frontend SPA
  # ==========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: kaamsetu-frontend-prod
    restart: always
    depends_on:
      - backend
    networks:
      - kaamsetu-prod-net

  # ==========================================
  # 4. Admin Dashboard SPA
  # ==========================================
  admin-dashboard:
    build:
      context: ./admin-dashboard
      dockerfile: Dockerfile
    container_name: kaamsetu-admin-prod
    restart: always
    depends_on:
      - backend
    networks:
      - kaamsetu-prod-net

  # ==========================================
  # 5. Production Nginx Reverse Proxy & Gateway
  # ==========================================
  nginx-proxy:
    image: nginx:alpine
    container_name: kaamsetu-nginx-proxy
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - backend
      - frontend
      - admin-dashboard
    networks:
      - kaamsetu-prod-net

# ==========================================
# Persistent Volumes & Network
# ==========================================
volumes:
  mongo_data_prod:
    driver: local

networks:
  kaamsetu-prod-net:
    driver: bridge
